[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "investment-ai-radar-server"
version = "0.1.0"
description = "Private single-user investment information radar API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "brotli>=1.1.0,<2",
  "exchange-calendars==4.13.2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2025.2,<2027",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]
translation-local = [
    "sacremoses>=0.1,<1",
    "sentencepiece>=0.2,<1",
    "torch>=2.7,<3",
    "transformers>=4.56,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
